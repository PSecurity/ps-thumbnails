<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek Security - Thumbnail Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* VARIÁVEIS DE CORES DINÂMICAS */
  :root {
    --main-color: #7B2FBE;
    --accent-color: #9D4EDD;
    --glow-opacity: 0.35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow Condensed', sans-serif;
    gap: 20px;
    padding: 20px;
  }

  .controls {
    background: #1a1a2e;
    border: 1px solid var(--main-color);
    border-radius: 12px;
    padding: 20px;
    width: 420px;
    color: white;
    max-height: 80vh;
    overflow-y: auto;
  }

  .controls h2 {
    font-family: 'Bebas Neue', cursive;
    color: var(--accent-color);
    font-size: 22px;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  .ctrl-group { margin-bottom: 12px; }
  .ctrl-group label {
    display: block;
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .ctrl-group input, .ctrl-group select {
    width: 100%;
    background: #0d0d1a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 8px 10px;
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .ctrl-group select option { background: #1a1a2e; }

  .btn-export {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: linear-gradient(135deg, var(--main-color), #000);
    border: 1px solid var(--accent-color);
    border-radius: 8px;
    color: white;
    font-family: 'Bebas Neue', cursive;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
  }

  /* ===== ESTILOS DA THUMBNAIL (USANDO VARIÁVEIS) ===== */
  .thumb-wrapper { position: relative; width: 420px; height: 745px; }
  #thumbnail { width: 420px; height: 745px; background: #05050f; position: relative; overflow: hidden; border-radius: 8px; }
  #thumbnail::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: 0; }
  
  .corner-glow { position: absolute; width: 200px; height: 200px; border-radius: 50%; filter: blur(60px); z-index: 0; transition: background 0.3s; }
  .glow-tl { top: -60px; left: -60px; background: var(--main-color); opacity: var(--glow-opacity); }
  .glow-br { bottom: -60px; right: -60px; background: var(--main-color); opacity: 0.25; }

  .corner-deco { position: absolute; width: 20px; height: 20px; border-color: var(--accent-color); border-style: solid; z-index: 10; }
  .cd-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .cd-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .cd-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .cd-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .logo-icon { width: 32px; height: 32px; background: var(--main-color); clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .logo-text span { color: var(--accent-color); }
  .tag-termux { position: absolute; top: 14px; right: 16px; background: rgba(0,0,0,0.6); border: 1px solid var(--accent-color); border-radius: 4px; padding: 3px 8px; color: var(--accent-color); font-family: 'Share Tech Mono'; font-size: 11px; z-index: 10; }

  .label-script { display: inline-block; background: var(--main-color); padding: 2px 10px; font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; margin-bottom: 2px; clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%); }
  .title-line2 { font-family: 'Bebas Neue'; font-size: 72px; line-height: 0.9; color: var(--accent-color); display: block; text-shadow: 3px 3px 0 #000, 0 0 30px var(--accent-color); }

  .terminal-block { position: absolute; top: 295px; right: 12px; width: 220px; background: rgba(0,0,0,0.92); border: 1px solid var(--main-color); border-radius: 8px; overflow: hidden; z-index: 10; box-shadow: 0 0 18px rgba(0,0,0,0.5); }
  .term-title-bar { font-family: 'Share Tech Mono'; font-size: 9px; color: var(--accent-color); margin-left: 4px; }
  .cursor { display: inline-block; width: 6px; height: 11px; background: #39ff14; animation: blink 1s infinite; vertical-align: middle; }

  .bullet-item { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 7px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); border-left: 2px solid var(--accent-color); border-radius: 4px; padding: 5px 8px; }

  .footer-bar { background: rgba(255,255,255,0.05); border-top: 1px solid var(--main-color); padding: 7px 16px; display: flex; align-items: center; justify-content: space-between; }
  .footer-cta span { color: #39ff14; }

  /* SCANLINE */
  #thumbnail::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); z-index: 20; pointer-events: none; }
</style>
</head>
<body>

<div class="controls">
  <h2>⚙ EDITOR PEEK PRO</h2>

  <div class="ctrl-group">
    <label>Tema de Cor (Hacker Style)</label>
    <select id="colorTheme" onchange="changeTheme()">
      <option value="purple">Roxo Peek (Padrão)</option>
      <option value="matrix">Matrix Green (Clássico)</option>
      <option value="cyber">Cyber Red (Alerta)</option>
      <option value="electric">Electric Blue (Ice)</option>
      <option value="gold">Gold Stealth (VIP)</option>
    </select>
  </div>

  <hr style="border:0; border-top:1px solid #333; margin:15px 0;">

  <div class="ctrl-group"><label>TikTok @</label><input type="text" id="tiktok" value="PEEKSECURITY" oninput="update()"></div>
  <div class="ctrl-group"><label>Título L2 (Destaque)</label><input type="text" id="t2" value="NMAP" oninput="update()"></div>
  <div class="ctrl-group"><label>Bullet 1</label><input type="text" id="b1" value="SCRIPT PERSONALIZADO" oninput="update()"></div>
  <div class="ctrl-group"><label>Terminal Alvo</label><input type="text" id="term_title" value="PEEK-NMAP-SCRIPT" oninput="update()"></div>

  <button class="btn-export" onclick="exportPNG()">⬇ EXPORTAR PNG</button>
</div>

<div class="thumb-wrapper">
  <div id="thumbnail">
    <div class="corner-glow glow-tl"></div><div class="corner-glow glow-br"></div>
    <div class="corner-deco cd-tl"></div><div class="corner-deco cd-tr"></div><div class="corner-deco cd-bl"></div><div class="corner-deco cd-br"></div>

    <div class="thumb-header" style="position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 8px; z-index:10;">
      <div class="logo-icon"><span style="color:white; font-size:14px;">👁</span></div>
      <div class="logo-text" style="font-family:'Bebas Neue'; color:white; letter-spacing:2px;">PEEK<span id="el-logo2">SECURITY</span></div>
    </div>

    <div class="tag-termux">&gt;_ Termux</div>

    <div class="thumb-title-area" style="position: absolute; top: 56px; left: 16px; z-index:10;">
      <div class="label-script">🔧 CRIADO POR PEEK</div>
      <span style="font-family:'Bebas Neue'; font-size:58px; color:white; display:block;">SCRIPT</span>
      <span class="title-line2" id="el-t2">NMAP</span>
      <div style="color:#39ff14; font-weight:bold; font-size:13px;">AUTOMATIZE SEUS SCANS COM UM CLIQUE!</div>
    </div>

    <div style="position: absolute; bottom: 155px; left: 0px; width: 180px; height: 220px; z-index: 6;">
      <svg viewBox="0 0 180 220" fill="none">
        <ellipse cx="90" cy="55" rx="45" ry="50" fill="#0d0020" stroke="var(--main-color)" stroke-width="1" opacity="0.9"/>
        <ellipse cx="76" cy="58" rx="7" ry="4" fill="var(--accent-color)" opacity="0.9"/>
        <ellipse cx="104" cy="58" rx="7" ry="4" fill="var(--accent-color)" opacity="0.9"/>
        <path d="M 45 105 Q 45 90 90 88 Q 135 90 135 105 L 145 200 L 35 200 Z" fill="#0a0018" stroke="var(--main-color)" stroke-opacity="0.2" stroke-width="1"/>
      </svg>
    </div>

    <div class="terminal-block">
      <div class="term-bar"><div style="width:7px; height:7px; border-radius:50%; background:#ff5f57;"></div><span class="term-title-bar" id="el-term_title">PEEK-NMAP-SCRIPT</span></div>
      <div class="term-body">
        <div style="color:#39ff14">$ bash peek_nmap.sh</div>
        <div style="color:#ff5f57">[!] VULN FOUND!</div>
        <div>~ $ <span class="cursor"></span></div>
      </div>
    </div>

    <div class="bullets-area" style="position: absolute; top: 310px; left: 14px; width: 195px; z-index: 10;">
      <div class="bullet-item"><div class="bullet-text" id="el-b1" style="color:white; font-size:11px; font-weight:bold;">SCRIPT PERSONALIZADO</div></div>
    </div>

    <div class="thumb-footer" style="position: absolute; bottom: 0; width: 100%; height: 90px; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;">
      <div class="footer-bar">
        <div style="font-family:'Bebas Neue'; color:white; font-size:15px;">CÓDIGO NA <span>COMUNIDADE!</span></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function changeTheme() {
    const theme = document.getElementById('colorTheme').value;
    const root = document.querySelector(':root');
    
    const themes = {
      purple: { main: '#7B2FBE', accent: '#9D4EDD' },
      matrix: { main: '#008F11', accent: '#00FF41' },
      cyber: { main: '#8B0000', accent: '#FF0000' },
      electric: { main: '#008B8B', accent: '#00FFFF' },
      gold: { main: '#B8860B', accent: '#FFD700' }
    };

    root.style.setProperty('--main-color', themes[theme].main);
    root.style.setProperty('--accent-color', themes[theme].accent);
  }

  function update() {
    document.getElementById('el-t2').textContent = document.getElementById('t2').value;
    document.getElementById('el-b1').textContent = document.getElementById('b1').value;
    document.getElementById('el-term_title').textContent = document.getElementById('term_title').value;
  }

  async function exportPNG() {
    const thumb = document.getElementById('thumbnail');
    const canvas = await html2canvas(thumb, { scale: 3 });
    const link = document.createElement('a');
    link.download = 'peek-hacker-thumb.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
