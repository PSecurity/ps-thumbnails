<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ps.editor - v1.4 Graphic Assets</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --main: #7B2FBE; --acc: #9D4EDD; --green: #39ff14; --bg: #05050f; }
  
  .theme-purple { --main: #7B2FBE; --acc: #9D4EDD; --green: #39ff14; }
  .theme-green { --main: #008f11; --acc: #00ff41; --green: #00ff41; }
  .theme-red { --main: #8b0000; --acc: #ff0000; --green: #ff4d4d; }
  .theme-blue { --main: #003366; --acc: #0077ff; --green: #00f2ff; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: 'Barlow Condensed', sans-serif; padding: 20px; color: white; }

  /* PAINEL */
  .controls { background: #151525; border: 2px solid var(--main); border-radius: 12px; padding: 20px; width: 550px; margin-bottom: 25px; box-shadow: 0 0 30px rgba(0,0,0,0.5); max-height: 60vh; overflow-y: auto; transition: 0.3s; }
  .controls h2 { font-family: 'Bebas Neue'; color: var(--main); font-size: 32px; margin-bottom: 15px; text-align: center; letter-spacing: 3px; }
  
  .theme-selector { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; background: #0a0a15; padding: 12px; border-radius: 8px; border: 1px solid #333; }
  .t-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .group { margin-bottom: 8px; }
  .full { grid-column: span 2; }
  label { display: block; font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 3px; font-weight: 900; }
  input { width: 100%; background: #0a0a15; border: 1px solid #333; border-radius: 4px; padding: 10px; color: white; font-size: 13px; outline: none; border-left: 3px solid var(--main); }

  .btn-save { width: 100%; margin-top: 15px; padding: 18px; background: var(--main); color: white; border: none; border-radius: 6px; font-family: 'Bebas Neue'; font-size: 24px; cursor: pointer; font-weight: bold; }

  /* THUMBNAIL */
  .wrapper { position: relative; width: 420px; height: 745px; }
  #thumbnail { width: 420px; height: 745px; background: var(--bg); position: relative; overflow: hidden; border: 1px solid #222; }
  
  /* NOVO: ASSET PNG NO CANTO SUPERIOR DIREITO */
  .hacker-asset { 
    position: absolute; 
    top: -20px; 
    right: -40px; 
    width: 320px; 
    height: 320px; 
    z-index: 5; 
    opacity: 0.6; 
    pointer-events: none;
    /* Faz o PNG brilhar na cor do tema */
    filter: drop-shadow(0 0 20px var(--main));
    transition: 0.5s all;
  }
  .hacker-asset img { width: 100%; height: 100%; object-fit: contain; }

  .scanline { position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.03); z-index: 6; pointer-events: none; animation: move 10s linear infinite; }
  @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
  #thumbnail::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(var(--main) 0.5px, transparent 0.5px); background-size: 20px 20px; opacity: 0.1; }

  .header-main { position: absolute; top: 20px; left: 20px; z-index: 10; font-family: 'Bebas Neue'; font-size: 22px; }
  .tag-tr { position: absolute; top: 20px; right: 20px; border: 1px solid var(--acc); padding: 3px 10px; font-family: 'Share Tech Mono'; font-size: 12px; color: var(--acc); background: rgba(0,0,0,0.7); z-index: 10; }

  .title-block { position: absolute; top: 55px; left: 20px; right: 20px; z-index: 10; }
  .label-peek { display: inline-block; background: var(--main); padding: 3px 12px; font-size: 12px; font-weight: 900; margin-bottom: 5px; clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%); }
  .t-l1 { font-family: 'Bebas Neue'; font-size: 62px; line-height: 0.85; display: block; text-shadow: 4px 4px 0 black; }
  .t-l2 { font-family: 'Bebas Neue'; font-size: 85px; line-height: 0.85; color: var(--acc); display: block; text-shadow: 4px 4px 0 black; }
  .t-l3 { font-family: 'Bebas Neue'; font-size: 48px; line-height: 0.85; display: block; margin-top: 5px; }
  .sub-green { display: inline-block; margin-top: 15px; background: #000; color: var(--green); padding: 8px 15px; font-size: 14px; font-weight: 900; border-left: 5px solid var(--green); text-transform: uppercase; }

  .terminal { position: absolute; top: 345px; right: 15px; width: 230px; height: 160px; background: rgba(2,2,8,0.98); border: 1px solid var(--main); border-radius: 8px; z-index: 10; padding: 12px; font-family: 'Share Tech Mono'; font-size: 10px; line-height: 1.4; box-shadow: 0 0 25px rgba(0,0,0,0.9); display: flex; flex-direction: column; }
  .term-h { color: var(--acc); border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; padding-bottom: 4px; display: flex; justify-content: space-between; }

  .bullets { position: absolute; top: 375px; left: 20px; z-index: 10; width: 180px; }
  .bullet { background: rgba(0,0,0,0.8); border-left: 4px solid var(--acc); padding: 8px 12px; margin-bottom: 10px; font-size: 12px; font-weight: 900; border-radius: 0 4px 4px 0; display: flex; align-items: center; gap: 8px; }

  .footer { position: absolute; bottom: 0; width: 100%; height: 140px; background: linear-gradient(to top, #000 60%, transparent); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .f-line { width: 85%; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); margin-bottom: 15px; box-shadow: 0 0 15px var(--green); }
</style>
</head>
<body class="theme-purple">

<div class="controls">
  <h2>🎛️ sudo ps.editor</h2>
  
  <div class="theme-selector">
    <div class="t-btn" style="background:#7B2FBE" onclick="setTheme('theme-purple')"></div>
    <div class="t-btn" style="background:#00ff41" onclick="setTheme('theme-green')"></div>
    <div class="t-btn" style="background:#ff0000" onclick="setTheme('theme-red')"></div>
    <div class="t-btn" style="background:#0077ff" onclick="setTheme('theme-blue')"></div>
  </div>

  <div class="grid">
    <div class="group full"><label>URL do PNG (Canto Dir.)</label><input type="text" id="i-png" value="https://i.imgur.com/K3Z0t9U.png" oninput="up()"></div>
    <div class="group"><label>Opacidade PNG</label><input type="text" id="i-op" value="0.6" oninput="up()"></div>
    <div class="group"><label>Logo Nome</label><input type="text" id="i-l1" value="PEEK" oninput="up()"></div>
    <div class="group"><label>Título L1</label><input type="text" id="i-t1" value="SCRIPT" oninput="up()"></div>
    <div class="group"><label>Título L2</label><input type="text" id="i-t2" value="NMAP" oninput="up()"></div>
    <div class="group full"><label>Título L3</label><input type="text" id="i-t3" value="NO TERMUX!" oninput="up()"></div>
    <div class="group"><label>Terminal Tit.</label><input type="text" id="i-trm-h" value="PEEK-SHELL" oninput="up()"></div>
    <div class="group"><label>L1: Comando</label><input type="text" id="i-trm-c" value="$ bash nmap_peek.sh" oninput="up()"></div>
    </div>
  <button class="btn-save" onclick="save()">BAIXAR THUMBNAIL (PNG)</button>
</div>

<div class="wrapper">
  <div id="thumbnail">
    <div class="hacker-asset" id="o-asset-wrap" style="opacity: 0.6;">
      <img id="o-png" src="https://i.imgur.com/K3Z0t9U.png" alt="hacker-element">
    </div>

    <div class="scanline"></div>
    <div class="header-main"><span id="o-l1">PEEK</span></div>
    
    <div class="title-block">
      <span class="t-l1" id="o-t1">SCRIPT</span>
      <span class="t-l2" id="o-t2">NMAP</span>
      <span class="t-l3" id="o-t3">NO TERMUX!</span>
    </div>

    <div class="terminal">
      <div class="term-h"><span id="o-trm-h">PEEK-SHELL</span><span>● ● ●</span></div>
      <div style="color:var(--green);" id="o-trm-c">$ bash nmap_peek.sh</div>
    </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function setTheme(theme) { document.body.className = theme; }
  
  function up() {
    // Atualiza imagem e opacidade
    document.getElementById('o-png').src = document.getElementById('i-png').value;
    document.getElementById('o-asset-wrap').style.opacity = document.getElementById('i-op').value;

    // Lógica de atualização de texto (igual v1.3)
    const fields = ['l1','t1','t2','t3','trm-h','trm-c']; 
    fields.forEach(f => {
      const input = document.getElementById('i-' + f);
      const output = document.getElementById('o-' + f);
      if(input && output) output.textContent = input.value;
    });
  }

  async function save() {
    const canvas = await html2canvas(document.getElementById('thumbnail'), { 
      scale: 3,
      useCORS: true // IMPORTANTE para carregar PNGs externos
    });
    const link = document.createElement('a');
    link.download = 'ps-editor-v1-4.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
