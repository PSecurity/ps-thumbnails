<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek Security - Thumbnail NMAP Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: ‘Barlow Condensed’, sans-serif;
  gap: 20px;
  padding: 20px;
}

.controls {
  background: #1a1a2e;
  border: 1px solid #7B2FBE;
  border-radius: 12px;
  padding: 20px;
  width: 420px;
  color: white;
}

.controls h2 {
  font-family: ‘Bebas Neue’, cursive;
  color: #9D4EDD;
  font-size: 22px;
  margin-bottom: 16px;
  letter-spacing: 2px;
}

.ctrl-group { margin-bottom: 12px; }
.ctrl-group label {
  display: block;
  font-size: 11px;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.ctrl-group input, .ctrl-group select {
  width: 100%;
  background: #0d0d1a;
  border: 1px solid #7B2FBE55;
  border-radius: 6px;
  padding: 8px 10px;
  color: white;
  font-family: ‘Barlow Condensed’, sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.ctrl-group input:focus, .ctrl-group select:focus {
  border-color: #9D4EDD;
}

/* Outros estilos permanecem inalterados */

</style>
</head>
<body>

<!-- CONTROLES -->
<div class="controls">
  <h2>⚙ EDITOR DE THUMBNAIL</h2>

  <!-- Menu de Fontes -->
  <div class="ctrl-group">
    <label for="fontSelector">Escolha a Fonte:</label>
    <select id="fontSelector" onchange="changeFont()">
      <option value="Lora, serif">Lora</option>
      <option value="Urbanist, sans-serif">Urbanist</option>
      <option value="Barlow Condensed, sans-serif">Barlow Condensed</option>
      <option value="Bebas Neue, cursive">Bebas Neue</option>
      <option value="Share Tech Mono, monospace">Share Tech Mono</option>
    </select>
  </div>

  <!-- Resto dos controles para personalizar os textos -->
  <div class="ctrl-group">
    <label>Linha 1 do Título (branco)</label>
    <input type="text" id="t1" value="SCRIPT" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Linha 2 do Título (roxo — destaque)</label>
    <input type="text" id="t2" value="NMAP" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Linha 3 do Título (branco)</label>
    <input type="text" id="t3" value="NO TERMUX!" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Subtítulo (verde)</label>
    <input type="text" id="tsub" value="AUTOMATIZE SEUS SCANS COM UM CLIQUE!" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Bullet 1</label>
    <input type="text" id="b1" value="SCRIPT PERSONALIZADO" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Bullet 2</label>
    <input type="text" id="b2" value="SCANS AUTOMÁTICOS" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Bullet 3</label>
    <input type="text" id="b3" value="DETECÇÃO DE VULNERABILIDADES" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Bullet 4</label>
    <input type="text" id="b4" value="100% NO CELULAR" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Rodapé CTA</label>
    <input type="text" id="footer" value="CÓDIGO DISPONÍVEL NA COMUNIDADE!" oninput="update()">
  </div>

  <button class="btn-export" onclick="exportPNG()">⬇ EXPORTAR COMO PNG</button>
</div>

<!-- THUMBNAIL -->
<div class="thumb-wrapper">
  <div id="thumbnail">
    <!-- Glows, bordas e outros elementos permanecem inalterados -->
    
    <!-- Título -->
    <div class="thumb-title-area">
      <div class="label-script">🔧 CRIADO POR PEEK</div>
      <span class="title-line1" id="el-t1">SCRIPT</span>
      <span class="title-line2" id="el-t2">NMAP</span>
      <span class="title-line3" id="el-t3">NO TERMUX!</span>
      <div class="title-sub" id="el-tsub">AUTOMATIZE SEUS SCANS COM UM CLIQUE!</div>
    </div>

    <!-- Restante do HTML -->

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// Função para atualizar os textos na thumbnail
function update() {
  const fields = ['t1','t2','t3','tsub','b1','b2','b3','b4','footer'];
  fields.forEach(id => {
    const el = document.getElementById('el-' + id);
    const val = document.getElementById(id).value;
    if (el) {
      if (['b1','b2','b3','b4'].includes(id)) {
        el.innerHTML = val;  // Mantém a formatação de texto com tags (ex: <span>)
      } else {
        el.textContent = val;  // Para outros campos, apenas insere o texto
      }
    }
  });
}

// Função para alterar a fonte
function changeFont() {
  const selectedFont = document.getElementById('fontSelector').value;
  document.body.style.fontFamily = selectedFont;  // Altera a fonte de todo o corpo
  
  // Atualiza a fonte nos elementos específicos
  document.getElementById('el-t1').style.fontFamily = selectedFont;
  document.getElementById('el-t2').style.fontFamily = selectedFont;
  document.getElementById('el-t3').style.fontFamily = selectedFont;
  document.getElementById('el-tsub').style.fontFamily = selectedFont;
  document.getElementById('el-footer').style.fontFamily = selectedFont;
  
  // Salvar a fonte escolhida para persistência (caso o usuário recarregue a página)
  localStorage.setItem('chosenFont', selectedFont);
}

// Carregar a fonte salva (caso o usuário já tenha selecionado uma antes)

  const savedFont = localStorage.getItem('chosenFont');
  if (savedFont) {

    document.getElementById('el
