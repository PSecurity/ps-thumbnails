<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek Security - Thumbnail NMAP Script</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* TODO O SEU CSS ORIGINAL MANTIDO 100% */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow Condensed', sans-serif;
    gap: 20px;
    padding: 20px;
  }

  .controls {
    background: #1a1a2e;
    border: 1px solid #7B2FBE;
    border-radius: 12px;
    padding: 20px;
    width: 350px;
    color: white;
    max-height: 95vh;
    overflow-y: auto;
  }

  .controls h2 {
    font-family: 'Bebas Neue', cursive;
    color: #9D4EDD;
    font-size: 22px;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  .ctrl-group { margin-bottom: 12px; }
  .ctrl-group label {
    display: block;
    font-size: 10px;
    color: #aaa;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .ctrl-group input {
    width: 100%;
    background: #0d0d1a;
    border: 1px solid #7B2FBE55;
    border-radius: 6px;
    padding: 8px 10px;
    color: white;
    font-size: 14px;
    outline: none;
  }

  .btn-export {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: linear-gradient(135deg, #7B2FBE, #5a0fa0);
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'Bebas Neue', cursive;
    font-size: 18px;
    cursor: pointer;
  }

  /* ESTILOS DA THUMBNAIL - SEM ALTERAÇÕES NO SEU DESIGN */
  .thumb-wrapper { position: relative; width: 420px; height: 745px; shrink: 0; }
  #thumbnail { width: 420px; height: 745px; background: #05050f; position: relative; overflow: hidden; border-radius: 8px; }
  #thumbnail::before { content: ''; position: absolute; inset: 0; background-size: 30px 30px; z-index: 0; background-image: linear-gradient(rgba(123,47,190,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(123,47,190,0.08) 1px, transparent 1px); }
  .corner-glow { position: absolute; width: 200px; height: 200px; border-radius: 50%; filter: blur(60px); z-index: 0; }
  .glow-tl { top: -60px; left: -60px; background: rgba(123,47,190,0.35); }
  .glow-br { bottom: -60px; right: -60px; background: rgba(123,47,190,0.25); }
  .glow-tr { top: -40px; right: -40px; background: rgba(157,78,221,0.15); }
  .corner-deco { position: absolute; width: 20px; height: 20px; border-color: #9D4EDD; border-style: solid; z-index: 10; }
  .cd-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .cd-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .cd-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .cd-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }
  .thumb-header { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 8px; z-index: 10; }
  .logo-icon { width: 32px; height: 32px; background: #7B2FBE; clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .logo-text { font-family: 'Bebas Neue', cursive; font-size: 18px; letter-spacing: 3px; color: white; }
  .logo-text span { color: #9D4EDD; }
  .tag-termux { position: absolute; top: 14px; right: 16px; background: rgba(0,0,0,0.6); border: 1px solid #9D4EDD; border-radius: 4px; padding: 3px 8px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #9D4EDD; z-index: 10; }
  .thumb-title-area { position: absolute; top: 56px; left: 16px; right: 16px; z-index: 10; }
  .label-script { display: inline-block; background: #7B2FBE; padding: 2px 10px; font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%); }
  .title-line1 { font-family: 'Bebas Neue'; font-size: 58px; line-height: 0.95; color: white; display: block; }
  .title-line2 { font-family: 'Bebas Neue'; font-size: 72px; line-height: 0.9; color: #9D4EDD; display: block; text-shadow: 3px 3px 0 #000, 0 0 30px rgba(157,78,221,0.6); }
  .title-line3 { font-family: 'Bebas Neue'; font-size: 44px; line-height: 0.95; color: white; display: block; }
  .title-sub { display: inline-block; margin-top: 4px; background: linear-gradient(90deg, rgba(0,0,0,0.85), transparent); padding: 4px 10px; font-size: 13px; font-weight: 700; color: #39ff14; text-transform: uppercase; }
  .terminal-block { position: absolute; top: 295px; right: 12px; width: 220px; background: rgba(0,0,0,0.92); border: 1px solid #7B2FBE; border-radius: 8px; overflow: hidden; box-shadow: 0 0 18px rgba(123,47,190,0.5); z-index: 10; }
  .term-bar { background: #1a0a2e; padding: 5px 8px; display: flex; align-items: center; gap: 5px; }
  .term-dot { width: 7px; height: 7px; border-radius: 50%; }
  .term-dot.r { background: #ff5f57; }
  .term-body { padding: 8px; font-family: 'Share Tech Mono'; font-size: 9px; line-height: 1.6; color: #ccc; }
  .cursor { display: inline-block; width: 6px; height: 11px; background: #39ff14; animation: blink 1s infinite; vertical-align: middle; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .hacker-silhouette { position: absolute; bottom: 155px; left: 0px; width: 180px; height: 220px; z-index: 6; }
  .bullets-area { position: absolute; top: 310px; left: 14px; width: 195px; z-index: 10; }
  .bullet-item { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 7px; background: rgba(0,0,0,0.6); border: 1px solid #7B2FBE44; border-left: 2px solid #9D4EDD; border-radius: 4px; padding: 5px 8px; }
  .bullet-text { font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; }
  .platforms-badge { position: absolute; top: 260px; left: 14px; display: flex; gap: 6px; z-index: 10; }
  .platform-tag { background: rgba(0,0,0,0.7); border: 1px solid #9D4EDD; border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: #39ff14; }
  .thumb-footer { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: linear-gradient(0deg, #0a0015 0%, rgba(10,0,21,0.95) 60%, transparent 100%); z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; }
  .footer-bar { background: rgba(123,47,190,0.2); padding: 7px 16px; display: flex; align-items: center; justify-content: space-between; }
  .tiktok-badge { position: absolute; top: 54px; right: 16px; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.6); border: 1px solid #ffffff33; border-radius: 4px; padding: 3px 7px; z-index: 10; }
</style>
</head>
<body>

<div class="controls">
  <h2>⚙ CONFIGURAÇÕES</h2>
  <div class="ctrl-group"><label>Logo Texto 1</label><input type="text" id="logo1" value="PEEK" oninput="update()"></div>
  <div class="ctrl-group"><label>Logo Texto 2</label><input type="text" id="logo2" value="SECURITY" oninput="update()"></div>

  <div class="ctrl-group"><label>Título Linha 2</label><input type="text" id="t2" value="NMAP" oninput="update()"></div>

  <div class="ctrl-group"><label>Rodapé CTA</label><input type="text" id="footer" value="CÓDIGO NA COMUNIDADE!" oninput="update()"></div>
  <button class="btn-export" onclick="exportPNG()">⬇ EXPORTAR PNG</button>
</div>

<div class="thumb-wrapper">

    <div class="corner-glow glow-tl"></div><div class="corner-glow glow-br"></div><div class="corner-glow glow-tr"></div>
    <div class="corner-deco cd-tl"></div><div class="corner-deco cd-tr"></div><div class="corner-deco cd-bl"></div><div class="corner-deco cd-br"></div>

    <div class="thumb-header">
