<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek Security - Thumbnail Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ===== CSS ORIGINAL MANTIDO INTEGRALMENTE ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow Condensed', sans-serif;
    gap: 20px;
    padding: 20px;
  }

  .controls {
    background: #1a1a2e;
    border: 1px solid #7B2FBE;
    border-radius: 12px;
    padding: 20px;
    width: 420px;
    color: white;
    max-height: 80vh;
    overflow-y: auto;
  }

  .controls h2 {
    font-family: 'Bebas Neue', cursive;
    color: #9D4EDD;
    font-size: 22px;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  .ctrl-group { margin-bottom: 12px; }
  .ctrl-group label {
    display: block;
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .ctrl-group input {
    width: 100%;
    background: #0d0d1a;
    border: 1px solid #7B2FBE55;
    border-radius: 6px;
    padding: 8px 10px;
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .ctrl-group input:focus { border-color: #9D4EDD; }

  .btn-export {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: linear-gradient(135deg, #7B2FBE, #5a0fa0);
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'Bebas Neue', cursive;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
  }

  /* ===== ESTILOS DA THUMBNAIL (ORIGINAL) ===== */
  .thumb-wrapper { position: relative; width: 420px; height: 745px; }
  #thumbnail { width: 420px; height: 745px; background: #05050f; position: relative; overflow: hidden; border-radius: 8px; }
