<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ps.editor - v1.8 Blindado</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --main: #7B2FBE; --acc: #9D4EDD; --green: #39ff14; --bg: #05050f; }
  .theme-purple { --main: #7B2FBE; --acc: #9D4EDD; --green: #39ff14; }
  .theme-green { --main: #008f11; --acc: #00ff41; --green: #00ff41; }
  .theme-red { --main: #8b0000; --acc: #ff0000; --green: #ff4d4d; }
  .theme-blue { --main: #003366; --acc: #0077ff; --green: #00f2ff; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: 'Barlow Condensed', sans-serif; padding: 20px; color: white; }

  .controls { background: #151525; border: 2px solid var(--main); border-radius: 12px; padding: 20px; width: 550px; margin-bottom: 25px; box-shadow: 0 0 30px rgba(0,0,0,0.5); max-height: 60vh; overflow-y: auto; }
  .controls h2 { font-family: 'Bebas Neue'; color: var(--main); font-size: 32px; margin-bottom: 15px; text-align: center; }
  .theme-selector { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
  .t-btn { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
  
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input { width: 100%; background: #0a0a15; border: 1px solid #333; border-radius: 4px; padding: 10px; color: white; font-size: 13px; border-left: 3px solid var(--main); }
  label { display: block; font-size: 9px; color: #888; margin-bottom: 3px; }

  /* THUMBNAIL CANVAS */
  .wrapper { position: relative; width: 420px; height: 745px; }
  #thumbnail { width: 420px; height: 745px; background: var(--bg); position: relative; overflow: hidden; border: 1px solid #222; }

  /* MÁSCARA - POSICIONAMENTO ABSOLUTO FUNDO */
  .hacker-bg { 
    position: absolute; 
    top: -20px; 
    right: -40px; 
    width: 380px; 
    z-index: 1; /* Atrás de todos os textos */
    opacity: 0.5;
  }
  .hacker-bg img { width: 100%; height: auto; }

  /* BRILHO DE FUNDO QUE ACOMPANHA O TEMA */
  .glow-effect {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 200px;
    height: 200px;
    background: var(--main);
    filter: blur(80px);
    opacity: 0.3;
    z-index: 0;
  }

  .header-main { position: absolute; top: 25px; left: 25px; z-index: 10; font-family: 'Bebas Neue'; font-size: 24px; }
  .tag-tr { position: absolute; top: 25px; right: 25px; border: 1px solid var(--acc); padding: 4px 12px; font-family: 'Share Tech Mono'; font-size: 12px; color: var(--acc); z-index: 10; background: rgba(0,0,0,0.8); }

  .title-block { position: absolute; top: 70px; left: 25px; z-index: 10; width: 370px; }
  .t-l1 { font-family: 'Bebas Neue'; font-size: 65px; line-height: 0.8; display: block; }
  .t-l2 { font-family: 'Bebas Neue'; font-size: 90px; line-height: 0.8; color: var(--acc); display: block; }
  .t-l3 { font-family: 'Bebas Neue'; font-size: 50px; line-height: 0.8; display: block; }
  
  .badges { position: absolute; top: 320px; left: 25px; display: flex; gap: 10px; z-index: 10; }
  .b-tag { background: #000; border: 1.5px solid var(--acc); padding: 6px 14px; font-size: 13px; font-weight: 900; color: var(--green); border-radius: 4px; white-space: nowrap; }

  .terminal { position: absolute; top: 360px; right: 20px; width: 240px; height: 170px; background: rgba(0,0,0,0.95); border: 1px solid var(--main); border-radius: 8px; z-index: 10; padding: 15px; font-family: 'Share Tech Mono'; font-size: 11px; }

  .bullets { position: absolute; top: 390px; left: 25px; z-index: 10; }
  .bullet { background: rgba(0,0,0,0.85); border-left: 4px solid var(--acc); padding: 10px; margin-bottom: 8px; font-size: 12px; font-weight: 900; width: 200px; }

  .footer { position: absolute; bottom: 0; width: 100%; height: 130px; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(transparent, #000); }
  .f-line { width: 80%; height: 2px; background: linear-gradient(90deg, transparent, var(--main), transparent); margin-bottom: 15px; box-shadow: 0 0 15px var(--main); }
  .f-cta { font-family: 'Bebas Neue'; font-size: 30px; letter-spacing: 2px; }
  .f-cta span { color: var(--main); }

  .btn-save { width: 100%; padding: 20px; background: var(--main); color: #fff; border: none; font-family: 'Bebas Neue'; font-size: 26px; cursor: pointer; margin-top: 10px; border-radius: 8px; }
</style>
</head>
<body class="theme-purple">

<div class="controls">
  <h2>🎛️ sudo ps.editor v1.8</h2>
  <div class="theme-selector">
    <div class="t-btn" style="background:#7B2FBE" onclick="setTheme('theme-purple')"></div>
    <div class="t-btn" style="background:#00ff41" onclick="setTheme('theme-green')"></div>
    <div class="t-btn" style="background:#ff0000" onclick="setTheme('theme-red')"></div>
    <div class="t-btn" style="background:#0077ff" onclick="setTheme('theme-blue')"></div>
  </div>
  <div class="grid">
    <div class="group full"><label>URL DA MÁSCARA (PNG TRANSPARENTE)</label><input type="text" id="i-png" value="https://www.pngarts.com/files/1/Mask-Anonymous-PNG-Transparent-Image.png" oninput="up()"></div>
    <div class="group"><label>Logo</label><input type="text" id="i-l1" value="PEEK SECURITY" oninput="up()"></div>
    <div class="group"><label>Título 1</label><input type="text" id="i-t1" value="SCRIPT" oninput="up()"></div>
    <div class="group"><label>Título 2</label><input type="text" id="i-t2" value="NMAP" oninput="up()"></div>
    <div class="group"><label>Título 3</label><input type="text" id="i-t3" value="NO TERMUX!" oninput="up()"></div>
    <div class="group"><label>Badge 1</label><input type="text" id="i-b1" value="🤖 ANDROID" oninput="up()"></div>
    <div class="group"><label>Badge 2</label><input type="text" id="i-b2" value="🐧 LINUX" oninput="up()"></div>
    <div class="group full"><label>CTA Rodapé</label><input type="text" id="i-fc" value="BAIXE NA COMUNIDADE!" oninput="up()"></div>
  </div>
  <button class="btn-save" onclick="save()">BAIXAR THUMBNAIL (PNG)</button>
</div>

<div class="wrapper">
  <div id="thumbnail">
    <div class="glow-effect"></div>
    <div class="hacker-bg"><img id="o-png" src="https://www.pngarts.com/files/1/Mask-Anonymous-PNG-Transparent-Image.png" crossorigin="anonymous"></div>
    
    <div class="header-main" id="o-l1">PEEK SECURITY</div>
    <div class="tag-tr">>_ TERMUX</div>

    <div class="title-block">
      <span class="t-l1" id="o-t1">SCRIPT</span>
      <span class="t-l2" id="o-t2">NMAP</span>
      <span class="t-l3" id="o-t3">NO TERMUX!</span>
    </div>

    <div class="badges">
      <div class="b-tag" id="o-b1">🤖 ANDROID</div>
      <div class="b-tag" id="o-b2">🐧 LINUX</div>
    </div>

    <div class="terminal">
      <div style="color:var(--acc); border-bottom:1px solid #333; margin-bottom:5px;">PEEK-SHELL</div>
      <div style="color:var(--green)">$ nmap -sV target.com</div>
      <div style="color:#777; font-size:9px;">[+] Scanning ports...</div>
      <div style="color:#fff; margin-top:10px;">VULN DETECTED!</div>
    </div>

    <div class="bullets">
      <div class="bullet">⚡ 100% AUTOMÁTICO</div>
      <div class="bullet">🔍 SCAN PROFISSIONAL</div>
    </div>

    <div class="footer">
      <div class="f-line"></div>
      <div class="f-cta" id="o-fc">BAIXE NA <span>COMUNIDADE!</span></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function setTheme(theme) { 
    document.body.className = theme; 
    up(); 
  }
  
  function up() {
    document.getElementById('o-png').src = document.getElementById('i-png').value;
    const mapping = {
      'i-l1': 'o-l1', 'i-t1': 'o-t1', 'i-t2': 'o-t2', 'i-t3': 'o-t3', 
      'i-b1': 'o-b1', 'i-b2': 'o-b2'
    };
    for (let id in mapping) {
      document.getElementById(mapping[id]).textContent = document.getElementById(id).value;
    }
    // Rodapé especial
    const ctaVal = document.getElementById('i-fc').value;
    document.getElementById('o-fc').innerHTML = ctaVal.replace('COMUNIDADE!', '<span>COMUNIDADE!</span>');
  }

  async function save() {
    const el = document.getElementById('thumbnail');
    const canvas = await html2canvas(el, {
      scale: 3,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#05050f'
    });
    const link = document.createElement('a');
    link.download = 'peek-thumb-v1-8.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>
</body>
</html>
