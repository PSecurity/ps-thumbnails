<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEEK EDITOR - Thematic Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* SISTEMA DE TEMAS VIA VARIÁVEIS */
  :root {
    --main: #7B2FBE;
    --acc: #9D4EDD;
    --green: #39ff14;
    --bg: #05050f;
  }

  /* CLASSES DE TEMA */
  .theme-purple { --main: #7B2FBE; --acc: #9D4EDD; --green: #39ff14; }
  .theme-green { --main: #008f11; --acc: #00ff41; --green: #00ff41; }
  .theme-red { --main: #8b0000; --acc: #ff0000; --green: #ff4d4d; }
  .theme-blue { --main: #003366; --acc: #0077ff; --green: #00f2ff; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: 'Barlow Condensed', sans-serif; padding: 20px; color: white; }

  /* PAINEL PEEK EDITOR */
  .controls { background: #151525; border: 2px solid var(--main); border-radius: 12px; padding: 20px; width: 500px; margin-bottom: 25px; box-shadow: 0 0 30px rgba(123,47,190,0.3); max-height: 50vh; overflow-y: auto; transition: 0.3s; }
  .controls h2 { font-family: 'Bebas Neue'; color: var(--green); font-size: 32px; margin-bottom: 15px; text-align: center; letter-spacing: 3px; }
  
  .theme-selector { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; background: #0a0a15; padding: 10px; border-radius: 8px; border: 1px solid #333; }
  .t-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid white; cursor: pointer; transition: 0.2s; }
  .t-btn:hover { transform: scale(1.2); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .group { margin-bottom: 8px; }
  .full { grid-column: span 2; }
  label { display: block; font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 3px; font-weight: 900; }
  input { width: 100%; background: #0a0a15; border: 1px solid #333; border-radius: 4px; padding: 10px; color: white; font-size: 13px; outline: none; border-left: 3px solid var(--main); }
  
  .btn-save { width: 100%; margin-top: 15px; padding: 15px; background: var(--green); color: black; border: none; border-radius: 6px; font-family: 'Bebas Neue'; font-size: 22px; cursor: pointer; font-weight: bold; }

  /* THUMBNAIL */
  .wrapper { position: relative; width: 420px; height: 745px; }
  #thumbnail { width: 420px; height: 745px; background: var(--bg); position: relative; overflow: hidden; border: 1px solid #222; transition: 0.5s; }
  
  .scanline { position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.05); z-index: 5; animation: move 8s linear infinite; }
  @keyframes move { 0% { top: 0; } 100% { top: 100%; } }

  /* CABEÇALHO */
  .header-main { position: absolute; top: 20px; left: 20px; z-index: 10; font-family: 'Bebas Neue'; font-size: 22px; }
  .tag-tr { position: absolute; top: 20px; right: 20px; border: 1px solid var(--acc); padding: 3px 10px; font-family: 'Share Tech Mono'; font-size: 12px; color: var(--acc); background: rgba(0,0,0,0.7); z-index: 10; }

  /* TÍTULOS */
  .title-block { position: absolute; top: 55px; left: 20px; right: 20px; z-index: 10; }
  .label-peek { display: inline-block; background: var(--main); padding: 3px 12px; font-size: 12px; font-weight: 900; margin-bottom: 5px; clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%); }
  .t-l1 { font-family: 'Bebas Neue'; font-size: 62px; line-height: 0.85; display: block; text-shadow: 4px 4px 0 black; }
  .t-l2 { font-family: 'Bebas Neue'; font-size: 85px; line-height: 0.85; color: var(--acc); display: block; text-shadow: 4px 4px 0 black; }
  .t-l3 { font-family: 'Bebas Neue'; font-size: 48px; line-height: 0.85; display: block; margin-top: 5px; }
  .sub-green { display: inline-block; margin-top: 15px; background: #000; color: var(--green); padding: 8px 15px; font-size: 14px; font-weight: 900; border-left: 5px solid var(--green); }

  /* TERMINAL */
  .terminal { position: absolute; top: 345px; right: 15px; width: 230px; height: 160px; background: rgba(2,2,8,0.98); border: 1px solid var(--main); border-radius: 8px; z-index: 10; padding: 12px; font-family: 'Share Tech Mono'; font-size: 10px; line-height: 1.4; box-shadow: 0 0 25px rgba(0,0,0,0.9); }
  .term-h { color: var(--acc); border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; padding-bottom: 4px; display: flex; justify-content: space-between; }

  /* BULLETS */
  .bullets { position: absolute; top: 375px; left: 20px; z-index: 10; width: 180px; }
  .bullet { background: rgba(0,0,0,0.8); border-left: 4px solid var(--acc); padding: 8px 12px; margin-bottom: 10px; font-size: 12px; font-weight: 900; border-radius: 0 4px 4px 0; display: flex; align-items: center; gap: 8px; }

  /* RODAPÉ MONSTRO */
  .footer { position: absolute; bottom: 0; width: 100%; height: 140px; background: linear-gradient(to top, #000 50%, transparent); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .f-glow-line { width: 85%; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); margin-bottom: 15px; box-shadow: 0 0 15px var(--green); }
  .f-cta { font-family: 'Bebas Neue'; font-size: 28px; color: white; letter-spacing: 2px; }
  .f-cta span { color: var(--green); font-size: 32px; }

  .bg-glow { position: absolute; width: 300px; height: 300px; background: var(--main); filter: blur(100px); opacity: 0.15; z-index: 1; border-radius: 50%; transition: 0.5s; }
  .g-1 { top: 10%; left: -10%; }
  .g-2 { bottom: 5%; right: -10%; }
</style>
</head>
<body class="theme-purple">

<div class="controls" id="panel">
  <h2>🎛️ PEEK EDITOR</h2>
  
  <label style="text-align: center; display: block;">SELECIONE O TEMA</label>
  <div class="theme-selector">
    <div class="t-btn" style="background:#7B2FBE" onclick="setTheme('theme-purple')"></div>
    <div class="t-btn" style="background:#00ff41" onclick="setTheme('theme-green')"></div>
    <div class="t-btn" style="background:#ff0000" onclick="setTheme('theme-red')"></div>
    <div class="t-btn" style="background:#0077ff" onclick="setTheme('theme-blue')"></div>
  </div>

  <div class="grid">
    <div class="group"><label>Logo Parte 1</label><input type="text" id="i-l1" value="PEEK" oninput="up()"></div>
    <div class="group"><label>Logo Parte 2</label><input type="text" id="i-l2" value="SECURITY" oninput="up()"></div>
    <div class="group"><label>Tag Canto Sup.</label><input type="text" id="i-tr" value=">_ TERMUX" oninput="up()"></div>
    <div class="group"><label>Etiqueta Tit.</label><input type="text" id="i-et" value="🔧 CRIADO POR PEEK" oninput="up()"></div>
    <div class="group"><label>Título Linha 1</label><input type="text" id="i-t1" value="SCRIPT" oninput="up()"></div>
    <div class="group"><label>Título Linha 2</label><input type="text" id="i-t2" value="NMAP" oninput="up()"></div>
    <div class="group full"><label>Título Linha 3</label><input type="text" id="i-t3" value="NO TERMUX!" oninput="up()"></div>
    <div class="group full"><label>Subtítulo Impacto</label><input type="text" id="i-sub" value="AUTOMATIZE SEUS SCANS EM UM CLIQUE!" oninput="up()"></div>
    <div class="group"><label>Terminal Linha 1</label><input type="text" id="i-trm1" value="$ bash nmap_peek.sh" oninput="up()"></div>
    <div class="group"><label>Terminal Linha 2</label><input type="text" id="i-trm2" value="[+] Port 80 OPEN" oninput="up()"></div>
    <div class="group full"><label>Rodapé CTA</label><input type="text" id="i-fc" value="BAIXE NA COMUNIDADE!" oninput="up()"></div>
    <div class="group"><label>Bullet 1</label><input type="text" id="i-b1" value="SCRIPT PERSONALIZADO" oninput="up()"></div>
    <div class="group"><label>Bullet 2</label><input type="text" id="i-b2" value="SCANS AUTOMÁTICOS" oninput="up()"></div>
  </div>
  <button class="btn-save" onclick="save()">BAIXAR THUMBNAIL (PNG)</button>
</div>

<div class="wrapper">
  <div id="thumbnail">
    <div class="scanline"></div>
    <div class="bg-glow g-1"></div><div class="bg-glow g-2"></div>

    <div class="header-main">
      <span id="o-l1">PEEK</span><span id="o-l2" style="color:var(--acc)">SECURITY</span>
    </div>
    <div class="tag-tr" id="o-tr">>_ TERMUX</div>

    <div class="title-block">
      <div class="label-peek" id="o-et">🔧 CRIADO POR PEEK</div>
      <span class="t-l1" id="o-t1">SCRIPT</span>
      <span class="t-l2" id="o-t2">NMAP</span>
      <span class="t-l3" id="o-t3">NO TERMUX!</span>
      <div class="sub-green" id="o-sub">AUTOMATIZE SEUS SCANS EM UM CLIQUE!</div>
    </div>

    <div class="terminal">
      <div class="term-h"><span>PEEK-SHELL</span><span>● ● ●</span></div>
      <div style="color:var(--green); margin-bottom:4px;" id="o-trm1">$ bash nmap_peek.sh</div>
      <div style="color:#666; font-size:8px;">[SYSTEM] Initializing scan engine...</div>
      <div style="color:var(--acc)" id="o-trm2">[+] Port 80 OPEN</div>
      <div style="color:var(--green); border-top:1px solid #222; margin-top:5px; padding-top:5px;">[COMPLETED] _</div>
    </div>

    <div class="bullets">
      <div class="bullet">⚡ <span id="o-b1">SCRIPT PERSONALIZADO</span></div>
      <div class="bullet">🔍 <span id="o-b2">SCANS AUTOMÁTICOS</span></div>
    </div>

    <div class="footer">
      <div class="f-glow-line"></div>
      <div class="f-cta" id="o-fc">BAIXE NA <span>COMUNIDADE!</span></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function setTheme(themeName) {
    document.body.className = themeName;
  }

  function up() {
    const fields = ['l1','l2','tr','et','t1','t2','t3','sub','trm1','trm2','b1','b2','fc'];
    fields.forEach(f => {
      const val = document.getElementById('i-' + f).value;
      const out = document.getElementById('o-' + f);
      if(f === 'fc') {
        out.innerHTML = val.replace('COMUNIDADE!', '<span>COMUNIDADE!</span>');
      } else {
        out.textContent = val;
      }
    });
  }

  async function save() {
    const canvas = await html2canvas(document.getElementById('thumbnail'), { scale: 3 });
    const link = document.createElement('a');
    link.download = 'peek-themed-thumb.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
