<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ps-thumbnails · PEEK SECURITY engine</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* container central que segura tudo */
        .app-container {
            max-width: 360px;
            width: 100%;
            margin: 0 auto;
        }

        /* área de edição e preview juntas, mesma largura */
        .editor-panel {
            width: 100%;
            background: #111;
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #2a2a2a;
            box-shadow: 0 0 12px rgba(0, 255, 153, 0.1);
        }

        /* cada campo estilo terminal */
        .input-field {
            margin-bottom: 1rem;
            width: 100%;
        }

        .input-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0f0;
            margin-bottom: 0.3rem;
            font-weight: bold;
        }

        .input-field input,
        .input-field textarea,
        .input-field select {
            width: 100%;
            background: #000;
            border: 1px solid #2c2c2c;
            padding: 0.6rem;
            color: #0f0;
            font-family: monospace;
            font-size: 0.8rem;
            border-radius: 6px;
            outline: none;
            transition: 0.2s;
        }

        .input-field input:focus,
        .input-field textarea:focus,
        .input-field select:focus {
            border-color: #00ff99;
            box-shadow: 0 0 4px #00ff99;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        /* preview da thumbnail */
        .preview-area {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        #thumbnail-preview {
            width: 100%;
            max-width: 360px;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }

        /* conteúdo interno da thumb (seu design brutal) */
        .thumb-inner {
            padding: 1rem;
            background: linear-gradient(145deg, #0e0e0e, #050505);
        }

        .terminal-header {
            background: #1e1e1e;
            padding: 0.4rem 0.8rem;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #2c2c2c;
            font-size: 0.7rem;
            color: #aaa;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff5f56;
        }
        .dot:nth-child(2) { background: #ffbd2e; }
        .dot:nth-child(3) { background: #27c93f; }

        .terminal-body {
            padding: 0.8rem 0;
        }

        .prompt {
            color: #0f0;
            font-weight: bold;
        }

        .command {
            color: #f5f5f5;
            background: #1a1a1a;
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }

        .log-line {
            color: #bcbcbc;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            border-left: 2px solid #00ff99;
            padding-left: 0.5rem;
        }

        .badge {
            display: inline-block;
            background: #00ff991a;
            border: 1px solid #00ff99;
            color: #0f0;
            font-size: 0.6rem;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            margin-top: 0.6rem;
        }

        /* botão radical */
        .gen-btn {
            width: 100%;
            background: #000;
            border: 2px solid #00ff99;
            color: #00ff99;
            font-weight: bold;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .gen-btn:hover {
            background: #00ff99;
            color: #000;
            box-shadow: 0 0 12px #00ff99;
        }

        /* tema switcher */
        .theme-selector {
            margin: 1rem 0 0.5rem;
        }

        hr {
            border-color: #222;
            margin: 0.8rem 0;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="editor-panel">
        <div style="text-align: center; margin-bottom: 1rem;">
            <span style="color:#0f0; font-weight: bold;">⚡ ps.editor v2.0</span>
            <span style="color:#777; font-size:0.7rem;"> raw-code thumbnail forge</span>
        </div>

        <!-- campos de edição : mesmo largura do preview -->
        <div class="input-field">
            <label>🎯 MAIN TITLE</label>
            <input type="text" id="mainTitle" value="PEEK SECURITY">
        </div>

        <div class="input-field">
            <label>💻 COMMAND LINE</label>
            <input type="text" id="commandLine" value="sudo ps-editor --generate --ultrahd">
        </div>

        <div class="input-field">
            <label>📜 LOG / OUTPUT</label>
            <textarea id="logOutput" rows="2">[✓] Thumbnail engine ready
[+] Chroma shift enabled</textarea>
        </div>

        <div class="input-field">
            <label>🏷️ BADGE TEXT</label>
            <input type="text" id="badgeText" value="KALI LINUX / TERMUX">
        </div>

        <div class="input-field theme-selector">
            <label>🎨 COLOR THEME</label>
            <select id="colorTheme">
                <option value="neon">Neon Green (default)</option>
                <option value="purple">Purple Haze</option>
                <option value="red">Red Alert</option>
                <option value="blue">Blue Night</option>
            </select>
        </div>

        <hr>

        <!-- preview da thumbnail -->
        <div class="preview-area">
            <div id="thumbnail-preview">
                <div class="thumb-inner" id="thumbContent">
                    <div class="terminal-header">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                        <span style="margin-left: auto;">ps@thumbnail:~</span>
                    </div>
                    <div class="terminal-body">
                        <div class="prompt">
                            <span>$</span> <span class="command" id="cmdPreview">sudo ps-editor --generate --ultrahd</span>
                        </div>
                        <div class="log-line" id="logPreview">
                            [✓] Thumbnail engine ready<br>[+] Chroma shift enabled
                        </div>
                        <div class="badge" id="badgePreview">KALI LINUX / TERMUX</div>
                    </div>
                </div>
            </div>
        </div>

        <button class="gen-btn" id="captureBtn">⚡ GERAR THUMBNAIL ⚡</button>
        <div style="text-align: center; margin-top: 12px; font-size: 0.65rem; color:#444;">
            PEEK SECURITY · direct render
        </div>
    </div>
</div>

<script>
    (function() {
        // elementos
        const mainTitleInput = document.getElementById('mainTitle');
        const commandInput = document.getElementById('commandLine');
        const logTextarea = document.getElementById('logOutput');
        const badgeInput = document.getElementById('badgeText');
        const themeSelect = document.getElementById('colorTheme');
        
        const cmdPreviewSpan = document.getElementById('cmdPreview');
        const logPreviewDiv = document.getElementById('logPreview');
        const badgePreviewSpan = document.getElementById('badgePreview');
        const thumbInner = document.getElementById('thumbContent');
        
        // função que atualiza preview com base nos campos e tema
        function updatePreview() {
            // atualiza comando
            cmdPreviewSpan.innerText = commandInput.value || "ps --help";
            // log (mantém quebra de linha)
            let logRaw = logTextarea.value;
            logPreviewDiv.innerHTML = logRaw.replace(/\n/g, '<br>');
            // badge
            badgePreviewSpan.innerText = badgeInput.value || "PEEK ENGINE";
            // titulo principal não aparece na thumb atualmente? vamos adicionar um título estilizado
            // melhor: colocar um elemento extra .main-title na thumb, vou injetar dinâmico
            let existingTitle = document.getElementById('dynamicMainTitle');
            if(!existingTitle) {
                let newDiv = document.createElement('div');
                newDiv.id = 'dynamicMainTitle';
                newDiv.style.fontSize = '1.3rem';
                newDiv.style.fontWeight = 'bold';
                newDiv.style.marginBottom = '0.8rem';
                newDiv.style.textAlign = 'center';
                newDiv.style.letterSpacing = '-0.5px';
                newDiv.style.wordBreak = 'break-word';
                // coloca antes do terminal-header
                const terminalHeader = thumbInner.querySelector('.terminal-header');
                if(terminalHeader) thumbInner.insertBefore(newDiv, terminalHeader);
                existingTitle = newDiv;
            }
            existingTitle.innerText = mainTitleInput.value || "PEEK SECURITY";
            
            // aplica tema nas cores
            const theme = themeSelect.value;
            if(theme === 'neon') {
                document.documentElement.style.setProperty('--cor-primaria', '#0f0');
                thumbInner.style.background = "linear-gradient(145deg, #0e0e0e, #050505)";
                badgePreviewSpan.style.borderColor = "#0f0";
                badgePreviewSpan.style.color = "#0f0";
                badgePreviewSpan.style.backgroundColor = "#0f01a";
                cmdPreviewSpan.style.color = "#cfc";
                logPreviewDiv.style.borderLeftColor = "#0f0";
            }
            else if(theme === 'purple') {
                thumbInner.style.background = "linear-gradient(145deg, #1e0a2b, #0b0214)";
                badgePreviewSpan.style.borderColor = "#c084fc";
                badgePreviewSpan.style.color = "#e9c0ff";
                badgePreviewSpan.style.backgroundColor = "#c084fc1a";
                cmdPreviewSpan.style.color = "#e9c0ff";
                logPreviewDiv.style.borderLeftColor = "#c084fc";
            }
            else if(theme === 'red') {
                thumbInner.style.background = "linear-gradient(145deg, #2a0a0a, #150000)";
                badgePreviewSpan.style.borderColor = "#ff4444";
                badgePreviewSpan.style.color = "#ffa0a0";
                badgePreviewSpan.style.backgroundColor = "#ff44441a";
                cmdPreviewSpan.style.color = "#ff9f9f";
                logPreviewDiv.style.borderLeftColor = "#ff4444";
            }
            else if(theme === 'blue') {
                thumbInner.style.background = "linear-gradient(145deg, #0a1a2a, #010a14)";
                badgePreviewSpan.style.borderColor = "#3b82f6";
                badgePreviewSpan.style.color = "#a0c4ff";
                badgePreviewSpan.style.backgroundColor = "#3b82f61a";
                cmdPreviewSpan.style.color = "#bbd9ff";
                logPreviewDiv.style.borderLeftColor = "#3b82f6";
            }
        }
        
        // captura e download
        document.getElementById('captureBtn').addEventListener('click', function() {
            const element = document.getElementById('thumbnail-preview');
            html2canvas(element, {
                scale: 3,
                backgroundColor: null,
                logging: false,
                useCORS: false
            }).then(canvas => {
                const link = document.createElement('a');
                let titleClean = mainTitleInput.value.replace(/[^a-z0-9]/gi, '_').substring(0, 20);
                link.download = `ps_thumb_${titleClean || 'peek'}.png`;
                link.href = canvas.toDataURL();
                link.click();
            }).catch(err => {
                alert("Erro ao gerar: " + err);
            });
        });
        
        // eventos em tempo real
        mainTitleInput.addEventListener('input', updatePreview);
        commandInput.addEventListener('input', updatePreview);
        logTextarea.addEventListener('input', updatePreview);
        badgeInput.addEventListener('input', updatePreview);
        themeSelect.addEventListener('change', updatePreview);
        
        // inicializa
        updatePreview();
    })();
</script>
</body>
</html>
