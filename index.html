<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek Security - Ajuste de Layout</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --main-purple: #7B2FBE;
    --accent-purple: #9D4EDD;
    --glow-main: rgba(123,47,190,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Barlow Condensed', sans-serif; gap: 20px; padding: 20px; }

  /* PAINEL DE CONTROLE */
  .controls { background: #1a1a2e; border: 1px solid var(--main-purple); border-radius: 12px; padding: 20px; width: 440px; color: white; max-height: 35vh; overflow-y: auto; }
  .grid-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ctrl-group { margin-bottom: 8px; }
  .ctrl-group.full { grid-column: span 2; }
  .ctrl-group label { display: block; font-size: 9px; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
  .ctrl-group input, .ctrl-group select { width: 100%; background: #0d0d1a; border: 1px solid rgba(123,47,190,0.4); border-radius: 6px; padding: 6px; color: white; font-size: 12px; outline: none; }
  .btn-export { width: 100%; margin-top: 10px; padding: 10px; background: linear-gradient(135deg, var(--main-purple), #5a0fa0); border: none; border-radius: 8px; color: white; font-family: 'Bebas Neue'; font-size: 16px; cursor: pointer; }

  /* ===== THUMBNAIL AREA ===== */
  .thumb-wrapper { position: relative; width: 420px; height: 745px; }
  #thumbnail { width: 420px; height: 745px; background: #05050f; position: relative; overflow: hidden; border-radius: 8px; }
  
  /* Background Grid */
  #thumbnail::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(123,47,190,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(123,47,190,0.08) 1px, transparent 1px); background-size: 30px 30px; }

  /* TÍTULO - SUBIDO PARA NÃO ATROPELAR OS BADGES */
  .thumb-title-area { position: absolute; top: 45px; left: 16px; right: 16px; z-index: 10; }
  .label-script { display: inline-block; background: var(--main-purple); padding: 2px 10px; font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; margin-bottom: 2px; clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%); }
  .title-line1 { font-family: 'Bebas Neue'; font-size: 58px; line-height: 0.95; color: white; text-shadow: 3px 3px 0 #000; display: block; }
  .title-line2 { font-family: 'Bebas Neue'; font-size: 72px; line-height: 0.9; color: var(--accent-purple); text-shadow: 3px 3px 0 #000, 0 0 30px rgba(157,78,221,0.6); display: block; }
  .title-line3 { font-family: 'Bebas Neue'; font-size: 44px; line-height: 0.95; color: white; text-shadow: 2px 2px 0 #000; display: block; }
  
  /* O AJUSTE SOLICITADO: Subtítulo com mais destaque e margem */
  .title-sub { display: inline-block; margin-top: 8px; background: linear-gradient(90deg, rgba(0,0,0,0.9), transparent); padding: 5px 12px; font-size: 13.5px; font-weight: 900; color: #39ff14; text-transform: uppercase; border-left: 3px solid #39ff14; letter-spacing: 0.5px; }

  /* BADGES - REPOSICIONADOS ABAIXO DO SUBTÍTULO */
  .platforms-badge { position: absolute; top: 275px; left: 14px; display: flex; gap: 6px; z-index: 10; }
  .platform-tag { background: rgba(0,0,0,0.8); border: 1px solid var(--accent-purple); border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: 700; color: #39ff14; text-transform: uppercase; box-shadow: 0 0 10px rgba(57,255,20,0.1); }

  /* RESTANTE DO DESIGN FIEL */
  .corner-glow { position: absolute; width: 200px; height: 200px; border-radius: 50%; filter: blur(60px); z-index: 0; }
  .glow-tl { top: -60px; left: -60px; background: var(--glow-main); }
  .glow-br { bottom: -60px; right: -60px; background: rgba(123,47,190,0.25); }
  
  .thumb-header { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 8px; z-index: 10; }
  .logo-text { font-family: 'Bebas Neue'; font-size: 18px; letter-spacing: 3px; color: white; }
  .logo-text span { color: var(--accent-purple); }

  .terminal-block { position: absolute; top: 310px; right: 12px; width: 220px; background: rgba(0,0,0,0.95); border: 1px solid var(--main-purple); border-radius: 8px; overflow: hidden; z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
  .term-bar { background: #1a0a2e; padding: 6px; display: flex; align-items: center; gap: 5px; border-bottom: 1px solid rgba(123,47,190,0.3); }
  .term-dot { width: 7px; height: 7px; border-radius: 50%; }
  .term-dot.r { background: #ff5f57; } .term-dot.g { background: #28c840; }
  .term-body { padding: 10px; font-family: 'Share Tech Mono'; font-size: 9px; line-height: 1.6; color: #ccc; }
  .cursor { display: inline-block; width: 6px; height: 11px; background: #39ff14; animation: blink 1s infinite; vertical-align: middle; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .bullets-area { position: absolute; top: 330px; left: 14px; width: 195px; z-index: 10; }
  .bullet-item { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; background: rgba(0,0,0,0.6); border: 1px solid rgba(123,47,190,0.2); border-left: 2px solid var(--accent-purple); border-radius: 4px; padding: 6px 10px; }
  .bullet-text { font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; }
  .bullet-text span { color: var(--accent-purple); }

  .thumb-footer { position: absolute; bottom: 0; left: 0; right: 0; height: 95px; background: linear-gradient(0deg, #0a0015 0%, rgba(10,0,21,0.95) 70%, transparent 100%); z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 15px; }
  .footer-bar { background: rgba(123,47,190,0.2); border-top: 1px solid rgba(123,47,190,0.4); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
  .footer-cta { font-family: 'Bebas Neue'; font-size: 15px; color: white; }
  .footer-cta span { color: #39ff14; }
  .footer-warn { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 900; color: #ccc; text-transform: uppercase; }
  .warn-icon { width: 16px; height: 16px; background: var(--main-purple); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); display: flex; align-items: center; justify-content: center; font-size: 8px; color: white; }
</style>
</head>
<body>

<div class="controls">
  <div class="grid-edit">
    <div class="ctrl-group full"><label>Tema</label><select id="themeSelect" onchange="applyTheme()"><option value="purple">Original Purple</option><option value="green">Matrix Green</option><option value="red">Cyber Red</option></select></div>
    <div class="ctrl-group"><label>Título L1</label><input type="text" id="in-t1" value="SCRIPT" oninput="sync()"></div>
    <div class="ctrl-group"><label>Título L2</label><input type="text" id="in-t2" value="NMAP" oninput="sync()"></div>
    <div class="ctrl-group full"><label>Subtítulo (Verde)</label><input type="text" id="in-sub" value="AUTOMATIZE SEUS SCANS EM UM CLIQUE!" oninput="sync()"></div>
    <div class="ctrl-group"><label>Bullet 1</label><input type="text" id="in-b1" value="SCRIPT PERSONALIZADO" oninput="sync()"></div>
    <div class="ctrl-group"><label>Bullet 2</label><input type="text" id="in-b2" value="100% NO CELULAR" oninput="sync()"></div>
  </div>
  <button class="btn-export" onclick="exportThumb()">⬇ EXPORTAR PNG</button>
</div>

<div class="thumb-wrapper">
  <div id="thumbnail">
    <div class="corner-glow glow-tl"></div><div class="corner-glow glow-br"></div>
    
    <div class="thumb-header">
      <svg width="28" height="28" viewBox="0 0 32 32"><polygon points="16,2 30,10 30,22 16,30 2,22 2,10" fill="var(--main-purple)" stroke="var(--accent-purple)"/><text x="16" y="21" text-anchor="middle" font-size="14" fill="white">👁</text></svg>
      <div class="logo-text">PEEK<span>SECURITY</span></div>
    </div>

    <div class="thumb-title-area">
      <div class="label-script">🔧 CRIADO POR PEEK</div>
      <span class="title-line1" id="out-t1">SCRIPT</span>
      <span class="title-line2" id="out-t2">NMAP</span>
      <span class="title-line3">NO TERMUX!</span>
      <div class="title-sub" id="out-sub">AUTOMATIZE SEUS SCANS EM UM CLIQUE!</div>
    </div>

    <div class="platforms-badge">
      <div class="platform-tag">🤖 TERMUX</div>
      <div class="platform-tag">🐧 KALI LINUX</div>
    </div>

    <div class="terminal-block">
      <div class="term-bar"><div class="term-dot r"></div><div class="term-dot g"></div><span style="font-family:'Share Tech Mono'; font-size:9px; color:var(--accent-purple); margin-left:5px;">PEEK-SCANNER</span></div>
      <div class="term-body">
        <div><span style="color:#39ff14">$ bash start_scan.sh</span></div>
        <div><span style="color:var(--accent-purple)">[PROCURANDO ALVOS...]</span></div>
        <div><span style="color:#39ff14">[✓]</span> Host: 192.168.1.1</div>
        <div><span style="color:#ff5f57">Port 80: OPEN (VULN)</span></div>
        <div><span style="color:#666">~ $</span> <span class="cursor"></span></div>
      </div>
    </div>

    <div class="bullets-area">
      <div class="bullet-item">⚡<div class="bullet-text" id="out-b1">SCRIPT <span>PERSONALIZADO</span></div></div>
      <div class="bullet-item">📱<div class="bullet-text" id="out-b2">100% <span>NO CELULAR</span></div></div>
    </div>

    <div class="thumb-footer">
      <div class="footer-bar">
        <div class="footer-warn"><div class="warn-icon">!</div>AVISO ÉTICO</div>
        <div class="footer-cta">CÓDIGO NA <span>COMUNIDADE!</span></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function sync() {
    document.getElementById('out-t1').textContent = document.getElementById('in-t1').value;
    document.getElementById('out-t2').textContent = document.getElementById('in-t2').value;
    document.getElementById('out-sub').textContent = document.getElementById('in-sub').value;
    document.getElementById('out-b1').innerHTML = document.getElementById('in-b1').value.replace(' ', ' <span>') + '</span>';
    document.getElementById('out-b2').innerHTML = document.getElementById('in-b2').value.replace(' ', ' <span>') + '</span>';
  }

  function applyTheme() {
    const root = document.documentElement;
    const theme = document.getElementById('themeSelect').value;
    const colors = {
      purple: { m: '#7B2FBE', a: '#9D4EDD', g: 'rgba(123,47,190,0.35)' },
      green: { m: '#008F11', a: '#00FF41', g: 'rgba(0,143,17,0.35)' },
      red: { m: '#8B0000', a: '#FF0000', g: 'rgba(139,0,0,0.35)' }
    };
    root.style.setProperty('--main-purple', colors[theme].m);
    root.style.setProperty('--accent-purple', colors[theme].a);
    root.style.setProperty('--glow-main', colors[theme].g);
  }

  async function exportThumb() {
    const canvas = await html2canvas(document.getElementById('thumbnail'), { scale: 2 });
    const link = document.createElement('a');
    link.download = 'peek-thumb-ajustada.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
