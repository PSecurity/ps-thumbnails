<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peek Security - Thumbnail NMAP Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Barlow Condensed', sans-serif;
      gap: 20px;
      padding: 20px;
    }

    .controls {
      background: #1a1a2e;
      border: 1px solid #7B2FBE;
      border-radius: 12px;
      padding: 20px;
      width: 420px;
      color: white;
    }

    .controls h2 {
      font-family: 'Bebas Neue', cursive;
      color: #9D4EDD;
      font-size: 22px;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .ctrl-group {
      margin-bottom: 12px;
    }

    .ctrl-group label {
      display: block;
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .ctrl-group input, .ctrl-group select {
      width: 100%;
      background: #0d0d1a;
      border: 1px solid #7B2FBE55;
      border-radius: 6px;
      padding: 8px 10px;
      color: white;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .ctrl-group input:focus, .ctrl-group select:focus {
      border-color: #9D4EDD;
    }

    .btn-export {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: linear-gradient(135deg, #7B2FBE, #5a0fa0);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'Bebas Neue', cursive;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-export:hover {
      background: linear-gradient(135deg, #9D4EDD, #7B2FBE);
      transform: translateY(-1px);
    }

    /* ===== THUMBNAIL ===== */
    .thumb-wrapper {
      position: relative;
      width: 420px;
      height: 745px; /* 9:16 proporcional */
      margin-top: 20px;
    }

    #thumbnail {
      width: 420px;
      height: 745px;
      background: #05050f;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
    }

    /* Animações e efeito de glow */
    #thumbnail::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(123,47,190,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,47,190,0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
    }

    .corner-glow {
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
    }
    .glow-tl { top: -60px; left: -60px; background: rgba(123,47,190,0.35); }
    .glow-br { bottom: -60px; right: -60px; background: rgba(123,47,190,0.25); }
    .glow-tr { top: -40px; right: -40px; background: rgba(157,78,221,0.15); }

    /* Efeito de atualização do título e subtítulo em tempo real */
    .thumb-title-area {
      position: absolute;
      top: 56px;
      left: 16px;
      right: 16px;
      z-index: 10;
    }

    .title-line1, .title-line2, .title-line3 {
      font-family: 'Bebas Neue', cursive;
      color: white;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0 #000, 0 0 20px rgba(123,47,190,0.4);
      display: block;
    }

    .title-line2 {
      color: #9D4EDD;
      text-shadow: 3px 3px 0 #000, 0 0 30px rgba(157,78,221,0.6);
    }

    .title-line3 {
      font-size: 44px;
      text-shadow: 2px 2px 0 #000;
    }

    /* ===== RODAPÉ ===== */
    .thumb-footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: linear-gradient(0deg, #0a0015 0%, rgba(10,0,21,0.95) 60%, transparent 100%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 0 12px 0;
    }

    /* ================== */
    /* SCAN - GERAÇÃO PNG */
    /* ================== */
    .divider-line {
      position: absolute;
      left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #7B2FBE, transparent);
      z-index: 10;
    }
  </style>
</head>
<body>

<!-- CONTROLES -->
<div class="controls">
  <h2>⚙ EDITOR DE THUMBNAIL</h2>

  <!-- Resto dos controles para personalizar os textos -->
  <div class="ctrl-group">
    <label>Linha 1 do Título (branco)</label>
    <input type="text" id="t1" value="SCRIPT" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Linha 2 do Título (roxo — destaque)</label>
    <input type="text" id="t2" value="NMAP" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Linha 3 do Título (branco)</label>
    <input type="text" id="t3" value="NO TERMUX!" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Subtítulo (verde)</label>
    <input type="text" id="tsub" value="AUTOMATIZE SEUS SCANS COM UM CLIQUE!" oninput="update()">
  </div>
  <div class="ctrl-group">
    <label>Rodapé CTA</label>
    <input type="text" id="footer" value="CÓDIGO DISPONÍVEL NA COMUNIDADE!" oninput="update()">
  </div>

  <button class="btn-export" onclick="exportPNG()">⬇ EXPORTAR COMO PNG</button>
</div>

<!-- THUMBNAIL (Pré-visualização) -->
<div class="thumb-wrapper">
  <div id="thumbnail">
    <!-- Glows, bordas e header ficam como no original -->
    <div class="corner-glow glow-tl"></div>
    <div class="corner-glow glow-br"></div>
    <div class="corner-glow glow-tr"></div>

    <div class="thumb-title-area">
      <span class="title-line1"
